name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Verify executable version
        shell: pwsh
        run: |
          $match = Select-String -LiteralPath Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw 'cannot read the version from Cargo.toml' }
          $version = $match.Matches[0].Groups[1].Value
          $info = (Get-Item -LiteralPath target/release/pegline.exe).VersionInfo
          if ($info.ProductVersion -ne "$version.0") {
            throw "embedded version $($info.ProductVersion) does not match Cargo.toml $version"
          }

      - name: Report binary size
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath target/release/pegline.exe
          "pegline.exe: {0:N0} bytes" -f $exe.Length

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: pegline-win-x64
          path: target/release/pegline.exe
          if-no-files-found: error
