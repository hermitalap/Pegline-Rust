<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pegline 纸片模型 · 调参器</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #e9eef2;
    --surface: #ffffff;
    --ink: #1d2733;
    --muted: #68747e;
    --line: #d9e0e5;
    --accent: #2f736d;
    --accent-soft: #e4f0ee;
    --warm: #d5793f;
    --shadow: 0 10px 30px rgba(30, 50, 60, .07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 14px/1.45 "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 500px at 15% -10%, #f8fbfc 0%, rgba(248, 251, 252, 0) 70%),
      radial-gradient(900px 500px at 100% 0%, #f5eee4 0%, rgba(245, 238, 228, 0) 65%),
      var(--bg);
    min-height: 100vh;
  }
  header {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 28px 14px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
  header p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
  .badge {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .65);
    border-radius: 999px;
    padding: 6px 12px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 28px 18px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 392px;
    gap: 18px;
    align-items: start;
  }
  .stage-card, .panel, .graph-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .stage-card { overflow: hidden; }
  #stage { display: block; width: 100%; height: auto; touch-action: none; }
  .stage-foot {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 14px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
  }
  .stage-foot #hint { transition: color .2s ease; }
  .stage-foot #hint.show { color: var(--accent); font-weight: 600; }
  .panel { padding: 16px 16px 18px; max-height: 772px; overflow: auto; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .panel h2 { font-size: 15px; margin: 0 0 10px; }
  .preset-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 11px; }
  button {
    appearance: none;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 9px;
    padding: 7px 10px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  button:hover { background: #f5f8f9; border-color: #c4d0d6; }
  button:active { transform: translateY(1px); }
  button.active { background: var(--accent-soft); border-color: #a8cfc9; color: #1d5b56; }
  .group { border-top: 1px solid var(--line); padding: 10px 0 3px; }
  .group:first-of-type { border-top: 0; padding-top: 0; }
  .group h3 {
    margin: 0 0 6px;
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .control {
    display: grid;
    grid-template-columns: 96px minmax(0, 1fr) 66px;
    gap: 8px;
    align-items: center;
    padding: 2px 0;
  }
  .control > span { color: #3c4954; font-size: 12px; white-space: nowrap; }
  .control input[type=range] { width: 100%; accent-color: var(--accent); height: 18px; }
  .control output {
    text-align: right;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
  }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 13px 0 11px; }
  .actions button { padding: 9px 10px; }
  .actions button:first-child { background: var(--accent); border-color: var(--accent); color: #fff; }
  .actions button:first-child:hover { background: #286761; }
  .readout {
    border: 1px solid var(--line);
    background: #fbfcfc;
    border-radius: 12px;
    padding: 9px 11px;
    display: grid;
    gap: 4px;
  }
  .ro { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
  .ro span { color: var(--muted); width: 62px; flex: 0 0 auto; }
  .ro b { font-variant-numeric: tabular-nums; }
  .ro em { margin-left: auto; color: var(--muted); font-style: normal; font-variant-numeric: tabular-nums; }
  .metrics {
    margin-top: 9px;
    border-radius: 10px;
    background: #f5f8f7;
    color: #3f5a56;
    padding: 8px 10px;
    font-size: 12px;
    min-height: 34px;
  }
  .note { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
  .graphs {
    max-width: 1400px;
    margin: 0 auto 32px;
    padding: 0 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .graph-card { padding: 12px 14px 9px; }
  .graph-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 5px; }
  .graph-head h3 { margin: 0; font-size: 12px; color: #3c4954; }
  .graph-head span { color: var(--muted); font-size: 11px; }
  .graph-card svg { display: block; width: 100%; height: 170px; }
  #angleLine, #targetLine, #omegaLine { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #angleLine { stroke: var(--accent); stroke-width: 2; }
  #targetLine { stroke: var(--warm); stroke-width: 1.3; stroke-dasharray: 4 4; opacity: .9; }
  #omegaLine { stroke: var(--warm); stroke-width: 2; }
  #releaseLine { stroke: #7d8a92; stroke-width: 1; stroke-dasharray: 3 4; opacity: .7; }
  #pinGrab { cursor: grab; touch-action: none; }
  body.dragging, body.dragging #pinGrab { cursor: grabbing; }
  #copyBox {
    width: 100%;
    height: 92px;
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 7px 8px;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
    resize: vertical;
  }
  @media (max-width: 980px) {
    header { flex-direction: column; align-items: flex-start; gap: 8px; }
    main { grid-template-columns: 1fr; }
    .panel { max-height: none; }
    .graphs { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Pegline 纸片模型 · 调参器</h1>
    <p>拖动夹子横向甩动，松手看它像纸片一样摆；或按“轻弹一下”比较不同空气参数。</p>
  </div>
  <div class="badge">Rust 2.6.0 · paper model</div>
</header>

<main>
  <section class="stage-card">
    <svg id="stage" viewBox="0 0 900 560" role="img" aria-label="挂在绳子上的纸片，拖动夹子可以甩动">
      <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4f8fa"/>
          <stop offset="1" stop-color="#e4ebef"/>
        </linearGradient>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#b3b3b3"/>
          <stop offset=".35" stop-color="#ededed"/>
          <stop offset=".65" stop-color="#d1d1d1"/>
          <stop offset="1" stop-color="#9e9e9e"/>
        </linearGradient>
        <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fffefa"/>
          <stop offset="1" stop-color="#f2eee5"/>
        </linearGradient>
        <linearGradient id="photoGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7fb7b2"/>
          <stop offset=".5" stop-color="#e5b96f"/>
          <stop offset="1" stop-color="#d9825c"/>
        </linearGradient>
        <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#2f736d"/>
        </marker>
      </defs>

      <rect width="900" height="560" fill="url(#bgGrad)"/>
      <g id="ropeGroup">
        <path id="ropeShadow" fill="none" stroke="#8d9aa1" stroke-width="5" opacity=".14" transform="translate(0 2)"/>
        <path id="rope" fill="none" stroke="#6b5a46" stroke-width="2.6"/>
      </g>

      <g id="cardGroup" transform="translate(450 76.7)">
        <rect id="shadow" x="-75" y="21" width="150" height="112" rx="10" fill="#1d2733" opacity=".13"/>
        <rect id="paper" x="-75" y="14" width="150" height="112" rx="8" fill="url(#paperGrad)" stroke="#d8d2c6" stroke-width="1"/>
        <rect id="photo" x="-71" y="18" width="142" height="104" rx="4" fill="url(#photoGrad)" opacity=".92"/>
        <line id="plumb" x1="0" y1="0" x2="0" y2="146" stroke="#7f8c93" stroke-width="1" stroke-dasharray="3 5" opacity=".46"/>
        <rect id="pinShadow" x="-8" y="2" width="17" height="30" rx="4" fill="#1d2733" opacity=".16"/>
        <rect id="pin" x="-4.5" y="0" width="9" height="26" rx="3.5" fill="url(#metal)" stroke="#f2f2f2" stroke-width=".6"/>
        <rect id="pinSlot" x="-2.5" y="8.5" width="5" height="1.4" rx=".7" fill="#3b4650"/>
        <rect id="pinGrab" x="-16" y="-10" width="32" height="56" fill="transparent" pointer-events="all"/>
      </g>

      <g id="windGroup" opacity="0" pointer-events="none">
        <line id="windLine" x1="0" y1="0" x2="0" y2="0" stroke="#2f736d" stroke-width="2" marker-end="url(#arrowHead)"/>
        <text id="windLabel" x="0" y="0" fill="#2f736d" font-size="13" font-weight="600" text-anchor="middle">风</text>
      </g>
    </svg>
    <div class="stage-foot">
      <span id="hint">拖动夹子；松手后看它像纸片一样摆动。</span>
      <span id="fps">60 fps</span>
    </div>
  </section>

  <aside class="panel">
    <div class="panel-head">
      <h2>参数</h2>
    </div>
    <div class="preset-row">
      <button data-preset="rust" class="active">Rust 基线</button>
      <button data-preset="air">更强空气</button>
      <button data-preset="none">无空气</button>
      <button data-preset="paper">纸片</button>
    </div>
    <div id="controls"></div>
    <div class="actions">
      <button id="flick">轻弹一下</button>
      <button id="pause">暂停</button>
      <button id="reset">重置</button>
      <button id="copy">复制参数</button>
    </div>
    <textarea id="copyBox" readonly hidden aria-label="参数 JSON"></textarea>
    <div id="readout" class="readout"></div>
    <div id="metrics" class="metrics">拖动夹子，松手后显示峰值、过零和稳定时间。</div>
    <p class="note">
      高宽比 = 高 / 宽；更高更窄的纸片会自动获得更大的阻尼与风扭矩。
      当前 Rust 模型的空气阻力只作用在角向（线性阻尼 + 二次阻力 + 相对风扭矩），
      横向/垂向平动阻力尚未建模；这里也没有 6° 目标角的硬限位，只限制了目标值。
    </p>
  </aside>
</main>

<section class="graphs">
  <div class="graph-card">
    <div class="graph-head"><h3>角度 / 目标</h3><span>°</span></div>
    <svg id="angleGraph" viewBox="0 0 760 170" preserveAspectRatio="none" aria-label="角度随时间变化">
      <g id="angleGrid"></g>
      <line id="releaseLine" x1="0" y1="0" x2="0" y2="170" visibility="hidden"></line>
      <polyline id="targetLine" points=""></polyline>
      <polyline id="angleLine" points=""></polyline>
    </svg>
  </div>
  <div class="graph-card">
    <div class="graph-head"><h3>角速度</h3><span>°/s</span></div>
    <svg id="omegaGraph" viewBox="0 0 760 170" preserveAspectRatio="none" aria-label="角速度随时间变化">
      <g id="omegaGrid"></g>
      <line x1="0" y1="85" x2="760" y2="85" stroke="#dbe2e6" stroke-width="1"></line>
      <polyline id="omegaLine" points=""></polyline>
    </svg>
  </div>
</section>

<script>
"use strict";

const SVG_NS = "http://www.w3.org/2000/svg";
const STAGE_W = 900;
const SLOT_X = 450;
const ROPE_TOP = 70;
const PIN_ABOVE = 9.5;
const CARD_TOP = 14;
const PIN_W = 9;
const PIN_H = 26;
const DEFAULT_HINT = "拖动夹子；松手后看它像纸片一样摆动。";

const $ = (id) => document.getElementById(id);
const stage = $("stage");
const cardGroup = $("cardGroup");
const shadowEl = $("shadow");
const paperEl = $("paper");
const photoEl = $("photo");
const plumbEl = $("plumb");
const pinShadowEl = $("pinShadow");
const pinEl = $("pin");
const pinSlotEl = $("pinSlot");
const pinGrab = $("pinGrab");
const ropeEl = $("rope");
const ropeShadowEl = $("ropeShadow");
const windGroup = $("windGroup");
const windLine = $("windLine");
const windLabel = $("windLabel");
const controlsEl = $("controls");
const readoutEl = $("readout");
const metricsEl = $("metrics");
const hintEl = $("hint");
const fpsEl = $("fps");
const copyBox = $("copyBox");
const angleLine = $("angleLine");
const targetLine = $("targetLine");
const omegaLine = $("omegaLine");
const releaseLine = $("releaseLine");
const angleGrid = $("angleGrid");
const omegaGrid = $("omegaGrid");

const BASE = {
  width: 150,
  height: 112,
  air: 1,
  dampingBase: 1.116,
  dampingAspect: 0.434,
  dragBase: 0.279,
  dragAspect: 0.31,
  windBase: 4.34e-5,
  aspectNorm: 1.2,
  gravity: 35500,
  maxAngle: 6,
  deadzone: 300,
  flexMax: 1.2,
  releaseResponse: 0.46,
  releaseDamping: 0.80,
  followResponse: 0.075,
  followDamping: 0.85,
  dropResponse: 0.30,
  dropDamping: 0.55,
  timeScale: 1,
};

const PRESETS = {
  rust: {},
  air: {
    air: 1.55,
    dampingBase: 0.72,
    dampingAspect: 0.28,
    dragBase: 0.18,
    dragAspect: 0.2,
    windBase: 2.8e-5,
  },
  none: {
    air: 0,
    dampingBase: 0.0,
    dampingAspect: 0.0,
    dragBase: 0.0,
    dragAspect: 0.0,
    windBase: 0.0,
  },
  paper: {
    air: 2.0,
    dampingBase: 0.95,
    dampingAspect: 0.35,
    dragBase: 0.30,
    dragAspect: 0.10,
    windBase: 5.0e-5,
  },
};

const CONTROLS = [
  { group: "纸片", key: "width", label: "宽", min: 60, max: 240, step: 1, unit: "DIP", fmt: (v) => v.toFixed(0) },
  { group: "纸片", key: "height", label: "高", min: 60, max: 240, step: 1, unit: "DIP", fmt: (v) => v.toFixed(0) },
  { group: "空气", key: "air", label: "空气倍率", min: 0, max: 3, step: 0.05, unit: "×", fmt: (v) => v.toFixed(2) },
  { group: "空气", key: "dampingBase", label: "线性阻尼 ζ", min: 0, max: 1.4, step: 0.01, unit: "", fmt: (v) => v.toFixed(2) },
  { group: "空气", key: "dragBase", label: "二次阻力", min: 0, max: 0.6, step: 0.005, unit: "", fmt: (v) => v.toFixed(3) },
  { group: "空气", key: "windBase", label: "风扭矩增益", min: 0, max: 5e-5, step: 1e-6, unit: "", fmt: (v) => v.toExponential(1) },
  { group: "空气", key: "aspectNorm", label: "高宽比归一", min: 0.4, max: 2.5, step: 0.05, unit: "", fmt: (v) => v.toFixed(2) },
  { group: "空气", key: "dampingAspect", label: "高宽阻尼增量", min: 0, max: 0.5, step: 0.01, unit: "", fmt: (v) => v.toFixed(2) },
  { group: "空气", key: "dragAspect", label: "高宽阻力增量", min: 0, max: 0.4, step: 0.005, unit: "", fmt: (v) => v.toFixed(3) },
  { group: "摆动", key: "gravity", label: "重力", min: 15000, max: 60000, step: 500, unit: "DIP/s²", fmt: (v) => v.toFixed(0) },
  { group: "摆动", key: "maxAngle", label: "最大角", min: 1, max: 15, step: 0.5, unit: "°", fmt: (v) => v.toFixed(1) },
  { group: "摆动", key: "deadzone", label: "加速度死区", min: 0, max: 1200, step: 10, unit: "DIP/s²", fmt: (v) => v.toFixed(0) },
  { group: "摆动", key: "flexMax", label: "柔性上限", min: 0, max: 3, step: 0.1, unit: "°", fmt: (v) => v.toFixed(1) },
  { group: "响应", key: "releaseResponse", label: "释放响应", min: 0.2, max: 0.8, step: 0.01, unit: "s", fmt: (v) => v.toFixed(2) },
  { group: "响应", key: "releaseDamping", label: "释放阻尼", min: 0.4, max: 1.3, step: 0.01, unit: "ζ", fmt: (v) => v.toFixed(2) },
  { group: "响应", key: "followResponse", label: "跟随响应", min: 0.03, max: 0.2, step: 0.005, unit: "s", fmt: (v) => v.toFixed(3) },
  { group: "响应", key: "followDamping", label: "跟随阻尼", min: 0.5, max: 1.3, step: 0.01, unit: "ζ", fmt: (v) => v.toFixed(2) },
  { group: "响应", key: "dropResponse", label: "Y 跟随响应", min: 0.15, max: 0.6, step: 0.01, unit: "s", fmt: (v) => v.toFixed(2) },
  { group: "响应", key: "dropDamping", label: "Y 跟随阻尼", min: 0.3, max: 1.0, step: 0.01, unit: "ζ", fmt: (v) => v.toFixed(2) },
  { group: "时间", key: "timeScale", label: "时间倍率", min: 0.2, max: 2, step: 0.05, unit: "×", fmt: (v) => v.toFixed(2) },
];

let params = Object.assign({}, BASE);
let paused = false;

const state = {
  t: 0,
  sx: { value: SLOT_X, velocity: 0, target: SLOT_X, k: 0, c: 0 },
  sd: { value: 0, velocity: 0, target: 0, k: 0, c: 0 },
  flex: { value: 0, velocity: 0, target: 0, k: 0, c: 0 },
  angle: 0,
  omega: 0,
  target: 0,
  wind: 0,
  ax: 0,
  ay: 0,
  gEff: 0,
  leff: 0,
  damping: 0,
  drag: 0,
  windGain: 0,
  aspect: 0,
  tall: 0,
  lastVx: 0,
  lastVy: 0,
  dragging: false,
  grab: { dx: 0, dy: 0 },
  pointer: { x: SLOT_X, y: 0 },
  releaseActive: false,
  releaseAt: null,
  history: [],
  metrics: null,
};

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

function ropeY(x) {
  const sag = Math.min(STAGE_W * 0.018, 30);
  const f = clamp(x, 0, STAGE_W) / STAGE_W;
  return ROPE_TOP + 4 * sag * f * (1 - f);
}

function effectiveLength(width, height) {
  return clamp((width * width / 12 + height * height / 3) / (height / 2), 60, 220);
}

function paperCoefficients() {
  const aspect = Math.max(params.height / Math.max(params.width, 1), 0.01);
  const tall = clamp((aspect - 1) / Math.max(params.aspectNorm, 0.01), 0, 1);
  const damping = (params.dampingBase + params.dampingAspect * tall) * params.air;
  const drag = (params.dragBase + params.dragAspect * tall) * params.air;
  const windGain = params.windBase * (0.7 + 0.6 * tall) * params.air;
  return { aspect, tall, damping, drag, windGain };
}

function relativeWind(angle, omega, vx, vy, height, gain) {
  const theta = angle * Math.PI / 180;
  const om = omega * Math.PI / 180;
  const r = Math.max(height * 0.5, 1);
  const cos = Math.cos(theta);
  const sin = Math.sin(theta);
  const vxPoint = vx - r * om * cos;
  const vyPoint = vy - r * om * sin;
  const speed = Math.hypot(vxPoint, vyPoint);
  const wind = gain * speed * (vxPoint * cos + vyPoint * sin) * r;
  return clamp(wind, -6000, 6000);
}

function rubberY(raw) {
  const v = Math.max(0, raw);
  return v <= 18 ? v : Math.min(26, 18 + 0.22 * (v - 18));
}

function setSpringResponse(s, response, damping) {
  s.k = Math.pow((2 * Math.PI) / Math.max(response, 0.01), 2);
  s.c = (4 * Math.PI * damping) / Math.max(response, 0.01);
}

function stepSpring(s, dt) {
  const n = Math.max(1, Math.ceil(dt * 240));
  const h = dt / n;
  for (let i = 0; i < n; i++) {
    const a = s.k * (s.target - s.value) - s.c * s.velocity;
    s.velocity += a * h;
    s.value += s.velocity * h;
  }
  if (Math.abs(s.velocity) < 0.01 && Math.abs(s.target - s.value) < 0.01) {
    s.value = s.target;
    s.velocity = 0;
  }
}

function pinY() {
  return ropeY(state.sx.value) - PIN_ABOVE + state.sd.value;
}

function layoutRope() {
  let d = "";
  const x0 = 40;
  const x1 = STAGE_W - 40;
  for (let i = 0; i <= 60; i++) {
    const x = x0 + (x1 - x0) * i / 60;
    const y = ropeY(x);
    d += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
  }
  ropeEl.setAttribute("d", d);
  ropeShadowEl.setAttribute("d", d);
}

function layoutCard() {
  const w = params.width;
  const h = params.height;
  shadowEl.setAttribute("x", (-w / 2 + 5).toFixed(1));
  shadowEl.setAttribute("y", (CARD_TOP + 6).toFixed(1));
  shadowEl.setAttribute("width", w.toFixed(1));
  shadowEl.setAttribute("height", h.toFixed(1));
  paperEl.setAttribute("x", (-w / 2).toFixed(1));
  paperEl.setAttribute("y", CARD_TOP.toFixed(1));
  paperEl.setAttribute("width", w.toFixed(1));
  paperEl.setAttribute("height", h.toFixed(1));
  photoEl.setAttribute("x", (-w / 2 + 4).toFixed(1));
  photoEl.setAttribute("y", (CARD_TOP + 4).toFixed(1));
  photoEl.setAttribute("width", Math.max(4, w - 8).toFixed(1));
  photoEl.setAttribute("height", Math.max(4, h - 8).toFixed(1));
  plumbEl.setAttribute("y2", (CARD_TOP + h + 24).toFixed(1));
  pinShadowEl.setAttribute("x", (-PIN_W / 2 - 3.5).toFixed(1));
  pinShadowEl.setAttribute("height", (PIN_H + 4).toFixed(1));
  pinEl.setAttribute("x", (-PIN_W / 2).toFixed(1));
  pinEl.setAttribute("width", PIN_W.toFixed(1));
  pinEl.setAttribute("height", PIN_H.toFixed(1));
  pinSlotEl.setAttribute("x", (-2.5).toFixed(1));
  pinGrab.setAttribute("x", (-PIN_W / 2 - 7.5).toFixed(1));
  pinGrab.setAttribute("width", (PIN_W + 15).toFixed(1));
  pinGrab.setAttribute("y", (-10).toFixed(1));
  pinGrab.setAttribute("height", (PIN_H + 30).toFixed(1));
}

function buildControls() {
  const groups = [];
  for (const c of CONTROLS) {
    if (!groups.includes(c.group)) groups.push(c.group);
  }
  for (const group of groups) {
    const section = document.createElement("div");
    section.className = "group";
    const heading = document.createElement("h3");
    heading.textContent = group;
    section.appendChild(heading);
    for (const c of CONTROLS.filter((x) => x.group === group)) {
      const row = document.createElement("label");
      row.className = "control";
      const name = document.createElement("span");
      name.textContent = c.label;
      const input = document.createElement("input");
      input.type = "range";
      input.min = String(c.min);
      input.max = String(c.max);
      input.step = String(c.step);
      input.value = String(params[c.key]);
      input.dataset.key = c.key;
      const out = document.createElement("output");
      out.dataset.out = c.key;
      out.textContent = c.fmt(params[c.key]) + (c.unit ? " " + c.unit : "");
      input.addEventListener("input", () => {
        params[c.key] = Number(input.value);
        out.textContent = c.fmt(params[c.key]) + (c.unit ? " " + c.unit : "");
        onParamChanged(c.key);
      });
      row.append(name, input, out);
      section.appendChild(row);
    }
    controlsEl.appendChild(section);
  }
}

function syncControls() {
  for (const input of controlsEl.querySelectorAll("input[data-key]")) {
    const key = input.dataset.key;
    input.value = String(params[key]);
    const out = controlsEl.querySelector('output[data-out="' + key + '"]');
    const def = CONTROLS.find((c) => c.key === key);
    if (out && def) out.textContent = def.fmt(params[key]) + (def.unit ? " " + def.unit : "");
  }
}

function onParamChanged(key) {
  if (key === "width" || key === "height") {
    layoutCard();
    const lo = params.width / 2 + 40;
    const hi = STAGE_W - params.width / 2 - 40;
    state.sx.value = clamp(state.sx.value, lo, hi);
    state.sx.target = clamp(state.sx.target, lo, hi);
    if (!state.dragging && !state.releaseActive) state.sx.value = SLOT_X;
  }
}

function resetState() {
  state.t = 0;
  state.sx = { value: SLOT_X, velocity: 0, target: SLOT_X, k: 0, c: 0 };
  state.sd = { value: 0, velocity: 0, target: 0, k: 0, c: 0 };
  state.flex = { value: 0, velocity: 0, target: 0, k: 0, c: 0 };
  state.angle = 0;
  state.omega = 0;
  state.target = 0;
  state.wind = 0;
  state.ax = 0;
  state.ay = 0;
  state.gEff = params.gravity;
  state.leff = effectiveLength(params.width, params.height);
  state.damping = paperCoefficients().damping;
  state.drag = paperCoefficients().drag;
  state.windGain = paperCoefficients().windGain;
  state.aspect = paperCoefficients().aspect;
  state.tall = paperCoefficients().tall;
  state.dragging = false;
  state.lastVx = 0;
  state.lastVy = 0;
  state.grab = { dx: 0, dy: 0 };
  state.pointer = { x: SLOT_X, y: ropeY(SLOT_X) - PIN_ABOVE };
  state.releaseActive = false;
  state.releaseAt = null;
  state.history = [];
  state.metrics = null;
  setSpringResponse(state.sx, params.followResponse, params.followDamping);
  setSpringResponse(state.sd, params.dropResponse, params.dropDamping);
  setSpringResponse(state.flex, 0.12, 0.55);
  metricsEl.textContent = "拖动夹子，松手后显示峰值、过零和稳定时间。";
  hintEl.textContent = DEFAULT_HINT;
  hintEl.classList.remove("show");
  render();
}

function step(dt) {
  const w = params.width;
  const h = params.height;
  const coeff = paperCoefficients();
  const leff = effectiveLength(w, h);

  if (state.dragging) {
    const targetX = clamp(state.pointer.x + state.grab.dx, w / 2 + 40, STAGE_W - w / 2 - 40);
    state.sx.target = targetX;
    const rest = ropeY(targetX) - PIN_ABOVE;
    const raw = Math.max(0, state.pointer.y + state.grab.dy - rest);
    state.sd.target = rubberY(raw);
    setSpringResponse(state.sx, params.followResponse, params.followDamping);
    setSpringResponse(state.sd, params.dropResponse, params.dropDamping);
  } else {
    state.sx.target = SLOT_X;
    state.sd.target = 0;
    if (state.releaseActive) {
      setSpringResponse(state.sx, params.releaseResponse, params.releaseDamping);
      setSpringResponse(state.sd, 0.42, 0.72);
    }
  }

  stepSpring(state.sx, dt);
  stepSpring(state.sd, dt);

  const ax = clamp((state.sx.velocity - state.lastVx) / dt, -6000, 6000);
  const ay = clamp((state.sd.velocity - state.lastVy) / dt, -6000, 6000);
  state.lastVx = state.sx.velocity;
  state.lastVy = state.sd.velocity;
  state.ax = ax;
  state.ay = ay;
  state.leff = leff;
  state.gEff = clamp(params.gravity - ay, 0.25 * params.gravity, 1.75 * params.gravity);
  const omegaRad = Math.sqrt(state.gEff / leff);

  const active = state.dragging || state.releaseActive;
  state.target = active && Math.abs(ax) > params.deadzone
    ? clamp(Math.atan2(ax, state.gEff) * 180 / Math.PI, -params.maxAngle, params.maxAngle)
    : 0;

  state.wind = relativeWind(state.angle, state.omega, state.sx.velocity, state.sd.velocity, h, coeff.windGain);

  const n = Math.max(1, Math.ceil(dt * 240));
  const sub = dt / n;
  for (let i = 0; i < n; i++) {
    const accel = omegaRad * omegaRad * (state.target - state.angle)
      - 2 * coeff.damping * omegaRad * state.omega
      - coeff.drag * Math.abs(state.omega) * state.omega
      + state.wind;
    state.omega += accel * sub;
    state.angle += state.omega * sub;
  }

  state.damping = coeff.damping;
  state.drag = coeff.drag;
  state.windGain = coeff.windGain;
  state.aspect = coeff.aspect;
  state.tall = coeff.tall;

  state.flex.target = clamp(state.omega * 0.006, -params.flexMax, params.flexMax);
  stepSpring(state.flex, dt);

  if (state.releaseActive && Math.abs(state.sx.velocity) < 1 && Math.abs(state.sx.value - SLOT_X) < 0.5) {
    state.releaseActive = false;
  }

  state.t += dt;
  state.history.push({ t: state.t, angle: state.angle, target: state.target, omega: state.omega });
  const cutoff = state.t - 6;
  while (state.history.length && state.history[0].t < cutoff) state.history.shift();
  updateMetrics();
}

function updateMetrics() {
  if (state.releaseAt == null) {
    metricsEl.textContent = state.dragging ? "拖动中…松手后开始记录。" : "拖动夹子，松手后显示峰值、过零和稳定时间。";
    return;
  }
  const rows = state.history.filter((r) => r.t >= state.releaseAt);
  if (rows.length < 3) {
    metricsEl.textContent = "记录中…";
    return;
  }
  let peak = 0;
  let crossings = 0;
  let prev = 0;
  let lastActive = rows[0].t;
  for (const r of rows) {
    peak = Math.max(peak, Math.abs(r.angle));
    if (prev !== 0 && Math.sign(prev) !== Math.sign(r.angle) && Math.abs(r.angle) > 0.01) crossings++;
    prev = r.angle;
    if (Math.abs(r.angle) > 0.1 || Math.abs(r.omega) > 0.5) lastActive = r.t;
  }
  const end = rows[rows.length - 1].t;
  const stillMoving = end - lastActive < 0.15;
  const settle = stillMoving ? null : (lastActive - state.releaseAt) * 1000;
  metricsEl.textContent = "峰值 " + peak.toFixed(2) + "° · 过零 " + crossings
    + " · 稳定 " + (settle == null ? "仍在摆动" : settle.toFixed(0) + " ms");
}

const readoutFields = {};

function buildReadout() {
  const rows = [
    ['angle', '角度'],
    ['omega', '角速度'],
    ['leff', 'L_eff'],
    ['damping', '阻尼'],
    ['wind', '风增益'],
    ['velocity', 'vx / vy'],
  ];
  readoutEl.replaceChildren();
  for (const [key, label] of rows) {
    const row = document.createElement('div');
    row.className = 'ro';
    const name = document.createElement('span');
    name.textContent = label;
    const value = document.createElement('b');
    const extra = document.createElement('em');
    row.append(name, value, extra);
    readoutEl.appendChild(row);
    readoutFields[key] = { value, extra };
  }
}

function updateReadout() {
  const c = paperCoefficients();
  readoutFields.angle.value.textContent = state.angle.toFixed(2) + '°';
  readoutFields.angle.extra.textContent = '目标 ' + state.target.toFixed(2) + '°';
  readoutFields.omega.value.textContent = state.omega.toFixed(1) + '°/s';
  readoutFields.omega.extra.textContent = '风 ' + state.wind.toFixed(1);
  readoutFields.leff.value.textContent = state.leff.toFixed(0);
  readoutFields.leff.extra.textContent = '高宽比 ' + c.aspect.toFixed(2);
  readoutFields.damping.value.textContent = c.damping.toFixed(2);
  readoutFields.damping.extra.textContent = '二次 ' + c.drag.toFixed(3);
  readoutFields.wind.value.textContent = c.windGain.toExponential(2);
  readoutFields.wind.extra.textContent = 'g_eff ' + state.gEff.toFixed(0);
  readoutFields.velocity.value.textContent = state.sx.velocity.toFixed(0);
  readoutFields.velocity.extra.textContent = state.sd.velocity.toFixed(0);
}

function render() {
  const h = params.height;
  const py = pinY();
  const k = Math.tan(state.flex.value * Math.PI / 180);
  cardGroup.setAttribute(
    "transform",
    "translate(" + state.sx.value.toFixed(2) + " " + py.toFixed(2) + ") rotate(" + state.angle.toFixed(3)
    + ") matrix(1 0 " + k.toFixed(4) + " 1 0 0)"
  );

  const theta = state.angle * Math.PI / 180;
  const cos = Math.cos(theta);
  const sin = Math.sin(theta);
  const cyLocal = CARD_TOP + h / 2;
  const shearX = k * cyLocal;
  const cx = state.sx.value + shearX * cos - cyLocal * sin;
  const cy = py + shearX * sin + cyLocal * cos;

  const r = Math.max(h * 0.5, 1);
  const om = state.omega * Math.PI / 180;
  const vxPoint = state.sx.velocity - r * om * cos;
  const vyPoint = state.sd.velocity - r * om * sin;
  const speed = Math.hypot(vxPoint, vyPoint);

  if (speed > 12) {
    const ux = vxPoint / speed;
    const uy = vyPoint / speed;
    const len = clamp(speed * 0.06, 10, 80);
    const x2 = cx - ux * len;
    const y2 = cy - uy * len;
    windLine.setAttribute("x1", cx.toFixed(1));
    windLine.setAttribute("y1", cy.toFixed(1));
    windLine.setAttribute("x2", x2.toFixed(1));
    windLine.setAttribute("y2", y2.toFixed(1));
    windLabel.setAttribute("x", (x2 - ux * 12).toFixed(1));
    windLabel.setAttribute("y", (y2 - uy * 12 - 4).toFixed(1));
    windGroup.setAttribute("opacity", "0.85");
  } else {
    windGroup.setAttribute("opacity", "0");
  }

  updateReadout();
  drawGraphs();
}

function drawGraphs() {
  const span = 6;
  const now = state.t;
  const t0 = Math.max(0, now - span);
  const rows = state.history.filter((r) => r.t >= t0);
  const W = 760;
  const H = 170;
  const pad = 9;
  const xs = (t) => ((t - t0) / span) * (W - 2 * pad) + pad;

  let maxA = Math.max(8, params.maxAngle * 1.5);
  let maxO = 50;
  for (const r of rows) {
    maxA = Math.max(maxA, Math.abs(r.angle), Math.abs(r.target));
    maxO = Math.max(maxO, Math.abs(r.omega));
  }
  maxA *= 1.08;
  maxO *= 1.08;

  const ya = (v) => H / 2 - (v / maxA) * (H / 2 - pad);
  const yo = (v) => H / 2 - (v / maxO) * (H / 2 - pad);

  angleLine.setAttribute("points", rows.map((r) => xs(r.t).toFixed(1) + "," + ya(r.angle).toFixed(1)).join(" "));
  targetLine.setAttribute("points", rows.map((r) => xs(r.t).toFixed(1) + "," + ya(r.target).toFixed(1)).join(" "));
  omegaLine.setAttribute("points", rows.map((r) => xs(r.t).toFixed(1) + "," + yo(r.omega).toFixed(1)).join(" "));

  if (state.releaseAt != null && state.releaseAt >= t0) {
    const x = xs(state.releaseAt).toFixed(1);
    releaseLine.setAttribute("x1", x);
    releaseLine.setAttribute("x2", x);
    releaseLine.setAttribute("visibility", "visible");
  } else {
    releaseLine.setAttribute("visibility", "hidden");
  }
}

function buildGrid(g) {
  for (let i = 0; i <= 4; i++) {
    const y = 9 + i * (170 - 18) / 4;
    const line = document.createElementNS(SVG_NS, "line");
    line.setAttribute("x1", "0");
    line.setAttribute("y1", y.toFixed(1));
    line.setAttribute("x2", "760");
    line.setAttribute("y2", y.toFixed(1));
    line.setAttribute("stroke", "#e4eaee");
    line.setAttribute("stroke-width", "1");
    g.appendChild(line);
  }
}

function toSvg(evt) {
  const pt = stage.createSVGPoint();
  pt.x = evt.clientX;
  pt.y = evt.clientY;
  const ctm = stage.getScreenCTM();
  if (!ctm) return { x: SLOT_X, y: ropeY(SLOT_X) - PIN_ABOVE };
  const p = pt.matrixTransform(ctm.inverse());
  return { x: p.x, y: p.y };
}

let toastTimer = 0;
function toast(text) {
  hintEl.textContent = text;
  hintEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    hintEl.textContent = DEFAULT_HINT;
    hintEl.classList.remove("show");
  }, 1800);
}

function beginDrag(evt) {
  evt.preventDefault();
  const p = toSvg(evt);
  state.dragging = true;
  state.releaseActive = false;
  state.releaseAt = null;
  state.grab.dx = state.sx.value - p.x;
  state.grab.dy = pinY() - p.y;
  state.pointer = p;
  state.lastVx = state.sx.velocity;
  state.lastVy = state.sd.velocity;
  state.angle = 0;
  state.omega = 0;
  state.target = 0;
  state.flex.value = 0;
  state.flex.velocity = 0;
  state.history = [];
  state.metrics = null;
  pinGrab.setPointerCapture(evt.pointerId);
  document.body.classList.add("dragging");
}

function endDrag() {
  if (!state.dragging) return;
  state.dragging = false;
  state.releaseActive = true;
  state.releaseAt = state.t;
  state.lastVx = state.sx.velocity;
  state.lastVy = state.sd.velocity;
  state.sx.target = SLOT_X;
  state.sd.target = 0;
  setSpringResponse(state.sx, params.releaseResponse, params.releaseDamping);
  setSpringResponse(state.sd, 0.42, 0.72);
  state.history = [];
  document.body.classList.remove("dragging");
}

function flick() {
  paused = false;
  $("pause").textContent = "暂停";
  resetState();
  state.releaseActive = true;
  state.releaseAt = 0;
  state.sx.velocity = 1400;
  state.sx.target = SLOT_X;
  setSpringResponse(state.sx, params.releaseResponse, params.releaseDamping);
  state.history = [];
  state.metrics = null;
  hintEl.textContent = "轻弹：看它多久停下来。";
  hintEl.classList.add("show");
}

function applyPreset(name) {
  params = Object.assign({}, BASE, PRESETS[name] || {});
  const buttons = document.querySelectorAll("[data-preset]");
  for (const b of buttons) b.classList.toggle("active", b.dataset.preset === name);
  syncControls();
  layoutCard();
  resetState();
}

async function copyParams() {
  const text = JSON.stringify(params, null, 2);
  try {
    await navigator.clipboard.writeText(text);
    toast("参数已复制到剪贴板");
  } catch {
    copyBox.hidden = false;
    copyBox.value = text;
    copyBox.select();
    try {
      document.execCommand("copy");
      toast("参数已复制");
    } catch {
      toast("复制失败，请从下方文本框手动复制");
    }
    setTimeout(() => { copyBox.hidden = true; }, 5000);
  }
}

let last = performance.now();
let fpsSmooth = 60;

function frame(now) {
  const raw = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  if (raw > 0.0001) fpsSmooth = fpsSmooth * 0.92 + (1 / raw) * 0.08;

  if (!paused) {
    step(raw * params.timeScale);
  }
  render();
  fpsEl.textContent = Math.round(fpsSmooth) + " fps";
  requestAnimationFrame(frame);
}

pinGrab.addEventListener("pointerdown", beginDrag);
window.addEventListener("pointermove", (evt) => {
  if (!state.dragging) return;
  state.pointer = toSvg(evt);
});
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

document.querySelectorAll("[data-preset]").forEach((button) => {
  button.addEventListener("click", () => applyPreset(button.dataset.preset));
});

$("flick").addEventListener("click", flick);
$("pause").addEventListener("click", () => {
  paused = !paused;
  $("pause").textContent = paused ? "继续" : "暂停";
});
$("reset").addEventListener("click", () => {
  paused = false;
  $("pause").textContent = "暂停";
  applyPreset("rust");
});
$("copy").addEventListener("click", copyParams);

buildGrid(angleGrid);
buildGrid(omegaGrid);
layoutRope();
layoutCard();
buildControls();
buildReadout();
syncControls();
resetState();
requestAnimationFrame(frame);
</script>
</body>
</html>
